# Added by code-review's install script. The tool itself is in .code-review/.
name: Code review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Drafts wait; pull requests from forks get no secrets, so they are not reviewed.
    # Dependabot pull requests get no secrets either, so they are skipped rather than failed.
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The agents can read the checkout; the job token must not sit in .git/config.
          persist-credentials: false
      # Secrets reach this PR's own copy of the action by design: GitHub gives same-repository
      # branches secrets because their authors already have write access, and such an author can
      # add any workflow that reads any secret. Forks and Dependabot get none (see `if:` above).
      - uses: ./.code-review
        with:
          auth: ${{ vars.CODE_REVIEW_AUTH || 'subscription' }}
          codex-auth-json-b64: ${{ secrets.CODEX_AUTH_JSON_B64 }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          github-token: ${{ github.token }}
