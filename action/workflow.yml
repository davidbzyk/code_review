# Added by code-review's install script. The tool itself is in .code-review/.
name: Code review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Drafts wait; pull requests from forks get no secrets, so they are not reviewed.
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.code-review
        with:
          auth: ${{ vars.CODE_REVIEW_AUTH || 'subscription' }}
          codex-auth-json-b64: ${{ secrets.CODEX_AUTH_JSON_B64 }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          github-token: ${{ github.token }}
